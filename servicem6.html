<html lang="en">
<head>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #03060f);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(59,130,246,0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .quiz-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: rgba(12, 18, 34, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            box-shadow: 0 30px 50px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08), 0 0 30px rgba(59,130,246,0.2);
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .quiz-header {
            padding: 28px 26px 20px 26px;
            background: linear-gradient(135deg, rgba(15, 25, 45, 0.9), rgba(8, 15, 28, 0.95));
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .badge-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #a0e9ff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stats-panel {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .question-counter {
            background: rgba(139, 92, 246, 0.25);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 60px;
            font-bbbubbbbbbbb: 0.85rem;
            font-weight: 600;
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.5);
        }

        .progress-track {
            margin-top: 14px;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6, #a855f7);
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 0 8px rgba(59,130,246,0.5);
        }

        .quiz-card {
            padding: 28px 26px 32px;
            animation: fadeSlide 0.4s ease-out;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(12px);}
            100% { opacity: 1; transform: translateY(0);}
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.4;
            color: #f1f5f9;
            margin-bottom: 28px;
            letter-spacing: -0.2px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option {
            background: rgba(20, 30, 55, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .option:hover:not(.disabled-opt) {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.6);
            transform: translateX(5px);
        }

        .option.disabled-opt {
            cursor: default;
        }

        .option.correct-highlight {
            background: linear-gradient(105deg, rgba(16, 185, 129, 0.35), rgba(6, 148, 102, 0.25));
            border-left: 5px solid #10b981;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
        }

        .option.wrong-highlight {
            background: linear-gradient(105deg, rgba(239, 68, 68, 0.35), rgba(185, 28, 28, 0.25));
            border-left: 5px solid #ef4444;
        }

        .option-prefix {
            font-weight: 800;
            font-size: 1.1rem;
            width: 34px;
            height: 34px;
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e6;
        }

        .option-text {
            font-size: 0.98rem;
            font-weight: 500;
            color: #e2e8f0;
            line-height: 1.4;
            flex: 1;
        }

        .feedback-panel {
            background: rgba(0, 0, 0, 0.55);
            border-radius: 24px;
            padding: 18px 22px;
            margin: 16px 0 20px;
            border-left: 5px solid;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .feedback-correct {
            border-left-color: #10b981;
            background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05));
        }

        .feedback-wrong {
            border-left-color: #ef4444;
            background: linear-gradient(135deg, rgba(239,68,68,0.12), rgba(239,68,68,0.03));
        }

        .feedback-title {
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback-text {
            font-size: 0.9rem;
            color: #cbd5e6;
            line-height: 1.5;
        }

        .correct-title { color: #4ade80; }
        .wrong-title { color: #f87171; }

        .nav-buttons {
            display: flex;
            gap: 16px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 0;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(95deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:active { transform: scale(0.97); }
        .btn-outline:active { transform: scale(0.97); background: rgba(255,255,255,0.1);}
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none;}

        .result-container {
            text-align: center;
            padding: 20px 0 30px;
        }

        .score-circle {
            width: 170px;
            height: 170px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 100%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border: 3px solid rgba(59, 130, 246, 0.7);
            box-shadow: 0 0 40px rgba(59,130,246,0.3);
        }

        .score-number {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #a5f3fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .verdict {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #facc15, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 16px 0 12px;
        }

        .restart-btn {
            background: linear-gradient(95deg, #2563eb, #7c3aed);
            border: none;
            padding: 16px 28px;
            margin-top: 28px;
            font-size: 1.1rem;
            font-weight: 700;
            width: auto;
            display: inline-block;
        }

        /* Landing / resume screens */
        .landing, .resume-screen {
            padding: 40px 26px;
            text-align: center;
        }

        .landing h2, .resume-screen h2 {
            font-size: 2rem;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff, #a0e9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .landing p, .resume-screen p {
            color: #cbd5e6;
            margin-bottom: 32px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 300px;
            margin: 0 auto;
        }

        .big-btn {
            padding: 16px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .big-btn:hover {
            background: rgba(59, 130, 246, 0.4);
            transform: scale(1.02);
        }

        .module-link-btn {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            color: #cbd5e1;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .module-link-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.35);
            transform: scale(1.02);
        }

        .notes-page {
            padding: 28px 26px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .notes-page h3 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #c084fc;
        }

        .notes-content {
            color: #e2e8f0;
            line-height: 1.6;
        }

            margin: 20px 0 8px;
            color: #facc15;
        }

        .notes-content ul {
            margin-left: 20px;
            margin-bottom: 16px;
        }

        .notes-content li {
            margin-bottom: 6px;
        }

        .back-btn {
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* Styled "Read Short Note" button at the bottom of quiz */
        .notes-button-wrapper {
            padding: 20px 26px 26px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 8px;
        }

        .notes-button {
            background: linear-gradient(95deg, #2563eb, #7c3aed);
            border: none;
            border-radius: 60px;
            padding: 16px 20px;
            width: 100%;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);

        .notes-button:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #9b6cf6, #d094fc);
            box-shadow: 0 6px 18px rgba(139, 92, 246, 0.6);
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 18px;
            color: #4b5563;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        
        #developers {
            display: flex;
            flex-direction: column;
            gap: .3rem;
            font-size: 0.7rem;
            text-align: center;
            padding: 18px;
            color: #4b5563;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        @media (max-width: 550px) {
            .quiz-card { padding: 20px 18px; }
            .question-text { font-size: 1.25rem; }
            .option { padding: 12px 16px; }
            .title { font-size: 1.4rem; }
            .notes-button { padding: 14px; font-size: 0.9rem; }
        }
    </style>
</head>

        <h3>🍽️ CHAPTER 6: MAIN CABIN/ECONOMY CLASS SERVICE PROCEDURE<br><span style="font-size: 0.9rem; font-weight: normal;">Service Etiquette, Trolley Setups, and Meal Service by Flight Duration</span></h3>

        <p>This chapter outlines the standards for delivering exceptional service in the Economy (EY) Class. It covers Ethiopian Airlines' welcoming etiquette, general service rules, and detailed step-by-step meal and drink service procedures based on the length of the flight. Crucially, it specifies the exact setup for drink trolleys tailored to different service types.</p>

        <h4>🤝 General Etiquette & Welcoming Procedures</h4>
        <ul>
            <li><strong>Greeting:</strong> Welcome customers with a smile. Greetings must be formal, sincere, and courteous. It is customary to bow at the waist at first interaction and farewell (avoid casual nods).</li>
            <li><strong>Boarding:</strong> EY boarding is zonal; one crew member is accountable for prompt and effective delivery by position.</li>
            <li><strong>VIPs & Frequent Flyers:</strong> Star Alliance elite members in main cabin do not get C-9 service but must be given utmost attention. VIPs get priority during meal choice and must be addressed by title and name.</li>
            <li><strong>Special Attention:</strong> Be vigilant and assist elderly people, PRMs (Persons with Reduced Mobility), first riders, and children. Give children's giveaway kits ASAP and assist with IFE options.</li>
            <li><strong>Posture & Communication:</strong> Maintain eye contact, use full sentences, and move gracefully. <strong>Never</strong> lean on passenger seats or sit on armrests while passengers are on board.</li>
            <li><strong>Service Flow:</strong> EY service flow direction must start from FWD to AFT throughout the cabin. Meal trolleys must be loaded evenly by all galleys. Trays must never be distributed without drinks.</li>
        </ul>

        <h4>🥂 Drink Serving Etiquette</h4>
        <ul>
            <li>Drink service is done using a trolley. Requests are prepared on the trolley top in front of passengers.</li>
            <li>Always offer ice first (using ice tongs) before pouring the drink.</li>
            <li>Canned drinks must be poured into a tumbler unless the passenger insists otherwise. Wine bottles should be opened and poured into a tumbler.</li>
            <li>Always use the right hand to pour and serve (unless left-handed).</li>
            <li>For mixed long drinks, present a stirring rod. Always serve drinks with a napkin.</li>
            <li>On flights over 5 hours, if there is only one service, a full drink trolley must be passed before arrival. All services must be completed 30 minutes before landing.</li>
            <li>On medium/long-haul flights, after service, go around the cabin every 20 minutes with assorted drinks.</li>
        </ul>

        <hr>

            <li><strong>Process:</strong> Start from the 1st row of EY class (Service starts from FWD and MID; on Q-400, only FWD).</li>
            <li><strong>Service:</strong> Offer drinks (Soft drink, Juice, Water, Coffee/Tea). Serve Sandwich (SDw) or fruit cake with a napkin. Serve hot beverages on request on early morning flights.</li>
            <li><strong>Cleanup:</strong> Collect used items using trash collecting plastic bags (use gloves).</li>
        </ul>

            <li><strong>Cleanup:</strong> Collect trays using a trolley. Clean cabin using trash bag/lined drawer (use gloves).</li>

            <li>Place bulk fruit cake/muffin inside drinks trolley with napkin.</li>
            <li>Serve drink and bulk fruit cake/muffin with napkin.</li>
            <li>Collect left behind items from the cabin with plastic bags (use gloves).</li>
        </ul>

        <h6><span class="service-num">10.</span> 🌏 Special Services: Far East & IFTAR</h6>
        <ul>
            <li><strong>Refreshment Counter (Far East):</strong> Set up on galley surface (clean drawer lined with napkin) with non-alcoholic drinks and ice. Tumblers/napkins on a snack tray. No hot beverages. Noodles placed on a drawer with drinks on top of the galley. TL announces availability. Stow during turbulence.</li>
            <li><strong>IFTAR Meal (Short Haul <3 hrs):</strong> Note seat numbers of fasting passengers. Distribute snack box with water in trolley. Collect while serving hot beverages.</li>
            <li><strong>IFTAR Meal (Medium/Long Haul >3 hrs):</strong> Note seat numbers during cocktail biscuits service. Warm meal, prepare drinks, and arrange dates and individually packed Samosa/Spring roll in a drawer. Load casseroles and place dates/samosa on top. Serve hot meal tray with drinks. (For departures after 19:00, serve dates/samosa on request).</li>
        </ul>

        <h6><span class="service-num">11.</span> 🌙 LBM (Light Bite Meal) – Outbound Europe after Midnight (including ARN & DME)</h6>
        <ul>
            <li>Promote and sell Wi-Fi connectivity if available.</li>
            <li>
                <details class="inline-dropdown">
                    <summary>Prepare drinks along with tea and coffee on top of the trolley.</summary>
                    <div class="dropdown-body">
                        <ul>
                            <li>Tea, coffee, and drinks prepared on top of the trolley.</li>
                        </ul>
                    </div>
                </details>
            </li>
            <li>
                <details class="inline-dropdown">
                    <summary>Serve drink and LBM with the tray of salad, focaccia, and dessert along with tea/coffee.</summary>
                    <div class="dropdown-body">
                        <ul>
                            <li>Distribute LBM trays containing salad, focaccia, and dessert, along with the drinks and tea/coffee.</li>
                        </ul>
                    </div>
                </details>
            </li>
            <li>Collect and clear trays using trolley with small trash bag.</li>
            <li>Clean galley and service equipment.</li>
            <li>Attend (clean and replenish) Lavatories.</li>
        </ul>

        <hr>

        <h4>📦 Tray Collection Trolley Setup</h4>
        <ul>
            <li>Place two clean drawers covered with a small plastic bag on top of the trolley.</li>
        </ul>

        <div class="tip">
            <p><strong>💡 Crucial Reminders:</strong> Always wash hands before handling food. Check ovens for foreign objects before heating. Heat meals to the right temperature using the Meal Heating Guideline. Service starts from the window seat, but female passengers get priority. Awaken passengers for main meals only, being careful with deep sleepers. Avoid frequent touching/rearranging of items once the tray is set. Always ask permission before picking up a passenger's tray. Keep voice low if PAX are on board.</p>
        </div>
    </div>
`;
    // ===================== END CONFIGURATION =====================

    // Helper
    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ---------- QUIZ ENGINE (works with any QUESTIONS_DATA) ----------
    let questions = [];
    let currentIndex = 0;
    let userAnswers = [];
    let answerLocked = false;
    let autoTimer = null;
    let quizInitialized = false;
    let quizDynamicDiv = null; // will hold the #quizContent element

    const STORAGE_KEY = "custom_quiz_m6_progress";
    const CORRECT_SEQ_KEY = "custom_quiz_m6_correct_seq";

    // Generate balanced random sequence (equal distribution of 0-3, no consecutive repeats)
    function generateBalancedRandomSequence(total) {
        const perOption = Math.floor(total / 4);
        let remainder = total % 4;
        let counts = [perOption, perOption, perOption, perOption];
        for (let i = 0; i < remainder; i++) counts[i]++;
        let seq = [];
        let prev = -1;
        for (let i = 0; i < total; i++) {
            let available = [];
            for (let c = 0; c < 4; c++) {
                if (counts[c] > 0 && c !== prev) available.push(c);
            }
            if (available.length === 0) {
                for (let c = 0; c < 4; c++) {
                    if (counts[c] > 0) available.push(c);
                }
            }
            let randomIndex = Math.floor(Math.random() * available.length);
            let chosen = available[randomIndex];
            seq.push(chosen);
            counts[chosen]--;
            prev = chosen;
        }
        return seq;
    }

    // Reorder options so correct answer appears at sequence position
    function reorderQuestionsWithBalancedRandom(questionsArray) {
        const total = questionsArray.length;
        const storedSeq = localStorage.getItem(CORRECT_SEQ_KEY);
        let finalSeq;
        if (storedSeq) {
            finalSeq = JSON.parse(storedSeq);
        } else {
            finalSeq = generateBalancedRandomSequence(total);
            localStorage.setItem(CORRECT_SEQ_KEY, JSON.stringify(finalSeq));
        }
        for (let i = 0; i < questionsArray.length; i++) {
            const q = questionsArray[i];
            const originalCorrectIdx = q.correct;
            const correctText = q.options[originalCorrectIdx];
            const targetPos = finalSeq[i];
            const otherOptions = q.options.filter((_, idx) => idx !== originalCorrectIdx);
            const newOptions = new Array(4);
            newOptions[targetPos] = correctText;
            let otherIdx = 0;
            for (let j = 0; j < 4; j++) {
                if (j === targetPos) continue;
                newOptions[j] = otherOptions[otherIdx++];
            }
            q.options = newOptions;
            q.correct = targetPos;
        }
        return questionsArray;
    }

    function saveProgress() {
        const state = { currentIndex, userAnswers };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadProgress() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        try {
            const state = JSON.parse(saved);
            if (state.userAnswers && state.userAnswers.length === questions.length) {
                currentIndex = state.currentIndex;
                userAnswers = state.userAnswers;
                return true;
            }
        } catch(e) {}
        return false;
    }

    function hasProgress() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        try {
            const state = JSON.parse(saved);
            return state.userAnswers && state.userAnswers.some(a => a !== null);
        } catch(e) { return false; }
    }

    function resetQuiz() {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(CORRECT_SEQ_KEY);
        // Reinitialize with fresh balanced sequence
        const rawCopy = JSON.parse(JSON.stringify(QUESTIONS_DATA));
        questions = reorderQuestionsWithBalancedRandom(rawCopy);
        userAnswers = new Array(questions.length).fill(null);
        currentIndex = 0;
        answerLocked = false;
        saveProgress();
    }

    // ---------- RENDERING FUNCTIONS ----------
    function renderLanding() {
        document.getElementById("appRoot").innerHTML = `
            <div class="quiz-header">
                <div class="badge-row">
                    <a href="index.html" class="module-link-btn" style="padding: 5px 14px; font-size: 0.8rem; border-radius: 40px; margin-right: 8px;">🏠 Modules</a>
                    <div class="title">${escapeHtml(SUBJECT_NAME)} </div>
                </div>
            </div>
            <div class="landing">
                <h2>📖 Welcome</h2>
                <p>Test your knowledge or read the short notes</p>
                <div class="button-group">
                    <div class="big-btn" id="takeQuizBtn">📝 Take Quiz</div>
                    <div class="big-btn" id="readNotesBtn">📘 Read Short Notes</div>
                    <a href="index.html" class="module-link-btn">🏠 Back to Modules</a>
                </div>
            </div>
            <footer>📚 Based on course material</footer>
        `;
        document.getElementById("takeQuizBtn").onclick = () => startQuiz();
        document.getElementById("readNotesBtn").onclick = () => showNotes('landing');
    }

    function renderResume() {
        document.getElementById("appRoot").innerHTML = `
            <div class="quiz-header">
                <div class="badge-row">
                    <a href="index.html" class="module-link-btn" style="padding: 5px 14px; font-size: 0.8rem; border-radius: 40px; margin-right: 8px;">🏠 Modules</a>
                    <div class="title">${escapeHtml(SUBJECT_NAME)} </div>
                </div>
            </div>
            <div class="resume-screen">
                <h2>🔄 Resume Quiz</h2>
                <p>You have an unfinished quiz. Continue where you left off or start over.</p>
                <div class="button-group">
                    <div class="big-btn" id="restartQuizBtn">🔄 Restart Quiz</div>
                    <div class="big-btn" id="continueQuizBtn">▶ Continue Quiz</div>
                    <div class="big-btn" id="resumeNotesBtn">📘 Read Short Notes</div>
                    <a href="index.html" class="module-link-btn">🏠 Back to Modules</a>
                </div>
            </div>
            <footer>📚 Based on course material</footer>
        `;
        document.getElementById("restartQuizBtn").onclick = () => { resetQuiz(); startQuiz(); };
        document.getElementById("continueQuizBtn").onclick = () => startQuiz(true);
        document.getElementById("resumeNotesBtn").onclick = () => showNotes('resume');
    }

    function startQuiz(keepProgress = false) {
        if (!quizInitialized) {
            const rawCopy = JSON.parse(JSON.stringify(QUESTIONS_DATA));
            questions = reorderQuestionsWithBalancedRandom(rawCopy);
            userAnswers = new Array(questions.length).fill(null);
            currentIndex = 0;
            quizInitialized = true;
        }
        if (keepProgress) {
            loadProgress();
        } else {
            userAnswers.fill(null);
            currentIndex = 0;
            saveProgress();
        }
        renderQuiz();
    }

    function renderQuiz() {
        const appRoot = document.getElementById("appRoot");
        appRoot.innerHTML = `
            <div class="quiz-header">
                <div class="badge-row">
                    <div class="title" id="dynamicTitle">Question ${currentIndex+1}</div>
                    <div class="stats-panel">
                        <span class="question-counter" id="counterLabel">${userAnswers.filter(a=>a!==null).length} / ${questions.length}</span>
                    </div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: ${(userAnswers.filter(a=>a!==null).length/questions.length)*100}%"></div>
                </div>
            </div>
            <div id="quizContent"></div>
            <div class="notes-button-wrapper">
                <div class="notes-button" id="notesFromQuizBtn">📘 Read Short Notes</div>
            </div>
            <footer>📚 Based on course material</footer>
        `;
        // Get reference to quiz content container
        quizDynamicDiv = document.getElementById("quizContent");
        renderCurrentQuestion();
        // Attach notes button event
        document.getElementById("notesFromQuizBtn").onclick = () => showNotes('quiz');
    }

    function updateStats() {
  const correctCount = userAnswers.reduce((count, ans, idx) => count + (ans !== null && ans === questions[idx].correct ? 1 : 0), 0);
  const percent = (correctCount / questions.length) * 100;
  const fill = document.getElementById("progressFill");
  const counter = document.getElementById("counterLabel");
  if (fill) fill.style.width = `${percent}%`;
  if (counter) counter.innerText = `${correctCount} / ${questions.length}`;
  const titleDiv = document.getElementById("dynamicTitle");
  if (titleDiv) titleDiv.textContent = `Question ${currentIndex+1}`;
}

    function clearTimer() { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } }

    function selectAnswer(selectedIdx) {
        if (answerLocked) return;
        const q = questions[currentIndex];
        const isCorrect = (selectedIdx === q.correct);
        userAnswers[currentIndex] = selectedIdx;
        updateStats();
        answerLocked = true;
        saveProgress();
        renderFeedback(selectedIdx, isCorrect);
        if (isCorrect) {
            autoTimer = setTimeout(() => {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    answerLocked = false;
                    clearTimer();
                    renderCurrentQuestion();
                    saveProgress();
                } else {
                    if (userAnswers.every(a => a !== null)) renderResults();
                    else renderCurrentQuestion();
                    saveProgress();
                }
            }, 1100);
        }
    }

    function renderFeedback(selectedIdx, isCorrect) {
        const q = questions[currentIndex];
        const letters = ["A","B","C","D"];
        let optionsHtml = "";
        q.options.forEach((opt, idx) => {
            let extraClass = "";
            if (idx === q.correct) extraClass = "correct-highlight";
            else if (idx === selectedIdx && !isCorrect) extraClass = "wrong-highlight";
            optionsHtml += `
                <div class="option disabled-opt ${extraClass}">
                    <div class="option-prefix">${letters[idx]}</div>
                    <div class="option-text">${escapeHtml(opt)}</div>
                </div>
            `;
        });
        const correctLetter = letters[q.correct];
        const feedbackHtml = isCorrect ?
            `<div class="feedback-panel feedback-correct"><div class="feedback-title correct-title">✓ CORRECT</div><div class="feedback-text">${escapeHtml(q.explanation)}</div></div>` :
            `<div class="feedback-panel feedback-wrong"><div class="feedback-title wrong-title">✗ INCORRECT</div><div class="feedback-text"><strong>Correct answer: ${correctLetter}. ${escapeHtml(q.options[q.correct])}</strong><br>${escapeHtml(q.explanation)}</div></div>`;
        const navHtml = `
            <div class="nav-buttons">
                <div class="btn btn-outline" id="navPrev">◀ Previous</div>
                <div class="btn btn-primary" id="navNext">${currentIndex === questions.length-1 ? "Finish" : "Next ▶"}</div>
            </div>
        `;
        quizDynamicDiv.innerHTML = `<div class="quiz-card"><div class="question-text">${escapeHtml(q.text)}</div><div class="options-grid">${optionsHtml}</div>${feedbackHtml}${navHtml}</div>`;
        document.getElementById("navPrev")?.addEventListener("click", () => {
            if (currentIndex > 0) {
                clearTimer(); currentIndex--; answerLocked = false; renderCurrentQuestion(); saveProgress();
            }
        });
        const nextBtn = document.getElementById("navNext");
        if (nextBtn) {
            nextBtn.addEventListener("click", () => {
                if (currentIndex < questions.length-1) {
                    clearTimer(); currentIndex++; answerLocked = false; renderCurrentQuestion(); saveProgress();
                } else {
                    renderResults();
                }
            });
        }
        updateStats();
    }

    function renderCurrentQuestion() {
        clearTimer();
        if (userAnswers[currentIndex] !== null) {
            const saved = userAnswers[currentIndex];
            const isCor = (saved === questions[currentIndex].correct);
            renderFeedback(saved, isCor);
            return;
        }
        answerLocked = false;
        const q = questions[currentIndex];
        const letters = ["A","B","C","D"];
        let optsHtml = "";
        q.options.forEach((opt, idx) => {
            optsHtml += `<div class="option" data-opt="${idx}"><div class="option-prefix">${letters[idx]}</div><div class="option-text">${escapeHtml(opt)}</div></div>`;
        });
        const navHtml = `<div class="nav-buttons"><div class="btn btn-outline" id="prevClean">◀ Previous</div><div class="btn btn-primary" id="nextClean">${currentIndex === questions.length-1 ? "Finish" : "Next ▶"}</div></div>`;
        quizDynamicDiv.innerHTML = `<div class="quiz-card"><div class="question-text">${escapeHtml(q.text)}</div><div class="options-grid" id="optGrid">${optsHtml}</div>${navHtml}</div>`;
        document.querySelectorAll(".option").forEach(opt => {
            opt.addEventListener("click", (e) => {
                const idx = parseInt(opt.dataset.opt);
                selectAnswer(idx);
            });
        });
        document.getElementById("prevClean")?.addEventListener("click", () => {
            if (currentIndex > 0) { currentIndex--; renderCurrentQuestion(); saveProgress(); }
        });
        document.getElementById("nextClean")?.addEventListener("click", () => {
            if (currentIndex < questions.length-1) { currentIndex++; renderCurrentQuestion(); saveProgress(); }
            else if (userAnswers[currentIndex] !== null && currentIndex === questions.length-1) renderResults();
        });
        updateStats();
    }

    function renderResults() {
        let score = 0;
        for (let i=0; i<questions.length; i++) if (userAnswers[i] === questions[i].correct) score++;
        const percent = Math.round((score/questions.length)*100);
        let verdict = percent>=85 ? `🏆 ${SUBJECT_NAME} Master` : percent>=70 ? `🖨️ Advanced ${SUBJECT_NAME} Practitioner` : percent>=55 ? `📘 Emerging ${SUBJECT_NAME} Learner` : `🌱 ${SUBJECT_NAME} Explorer`;
        quizDynamicDiv.innerHTML = `<div class="quiz-card result-container"><div class="score-circle"><div class="score-number">${score}</div><div style="color:#94a3b8;">/ ${questions.length}</div></div><div class="verdict">${verdict}</div><p style="color:#cbd5e6; margin:12px 0;">Accuracy: ${percent}% • Mastery Level</p><div class="btn restart-btn" id="restartBtn">⟳ Restart Exam</div></div>`;
        document.getElementById("restartBtn")?.addEventListener("click", () => {
            resetQuiz();
            startQuiz();
        });
        const titleDiv = document.getElementById("dynamicTitle");
        if (titleDiv) titleDiv.textContent = "Quiz Completed";
    }

    function showNotes(returnView) {
        const appRoot = document.getElementById("appRoot");
        appRoot.innerHTML = `
            <div class="quiz-header">
                <div class="badge-row">
                    <div class="title">📘 Short Notes</div>
                </div>
            </div>
            <div class="notes-page">
                ${SHORT_NOTES_HTML}
                <button class="back-btn" id="backFromNotes">← Back</button>
            </div>
            <footer>📚 Based on course material</footer>
        `;
        document.getElementById("backFromNotes").onclick = () => {
            if (returnView === 'landing') renderLanding();
            else if (returnView === 'resume') renderResume();
            else if (returnView === 'quiz') startQuiz(true);
            else renderLanding();
        };
    }

    // ---------- INITIAL RENDERING ----------
    function initApp() {
        if (hasProgress()) {
            renderResume();
        } else {
            renderLanding();
        }
    }
    initApp();
</script>
