<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Welcome | Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #03060f);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(59,130,246,0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .quiz-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: rgba(12, 18, 34, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            box-shadow: 0 30px 50px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08), 0 0 30px rgba(59,130,246,0.2);
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .quiz-header {
            padding: 28px 26px 20px 26px;
            background: linear-gradient(135deg, rgba(15, 25, 45, 0.9), rgba(8, 15, 28, 0.95));
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .badge-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #a0e9ff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Landing screen matching index.html */
        .landing {
            padding: 40px 26px;
            text-align: center;
        }

        .landing h2 {
            font-size: 2rem;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff, #a0e9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .landing p {
            color: #cbd5e6;
            margin-bottom: 32px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 320px;
            margin: 0 auto;
        }

        .big-btn {
            padding: 16px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .big-btn:hover {
            background: rgba(59, 130, 246, 0.4);
            transform: scale(1.02);
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 18px;
            color: #4b5563;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        #developers {
            display: flex;
            flex-direction: column;
            gap: .3rem;
            font-size: 0.7rem;
            text-align: center;
            padding: 18px;
            color: #4b5563;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        @media (max-width: 550px) {
            .title { font-size: 1.4rem; }
            .landing { padding: 30px 18px; }
            .landing h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="quiz-container">
    <div class="quiz-header">
        <div class="badge-row">
            <div class="title">Service</div>
        </div>
    </div>
    <div class="landing">
        <h2>📖 Welcome</h2>
        <p>Test your knowledge or read the short notes</p>
        <div class="button-group">
            <a href="servicem5.html" class="big-btn" id="m5Btn">🍽️ M5 product knowledge</a>
            <a href="servicem6.html" class="big-btn" id="m6Btn">📋 M6 service procedure</a>
        </div>
    </div>
    <footer>📚 Based on course material</footer>
</div>
<div class="developers" id="developers">Developed by:
     <div>Ashenafi Girma
      and
       Talaksew Agegnehu</div>
     <div style="margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; color: #94a3b8; font-weight: 500; display: none;">
         <span>Views:</span>
         <img src="https://api.visitorbadge.io/api/visitors?path=talaksewmisganaw1.github.io%2Fservice_chapter_5&countColor=%233b82f6&style=flat" alt="Visitor Count" />
     </div>
</div>
</body>
</html>
