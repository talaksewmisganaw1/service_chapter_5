            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        }

            position: fixed;
            top: 0;
            left: 0;
            right: 0;

        }

            position: relative;
            z-index: 2;
        }

        .quiz-header {
            padding: 28px 26px 20px 26px;
            background: linear-gradient(135deg, rgba(15, 25, 45, 0.9), rgba(8, 15, 28, 0.95));

        }

        .badge-row {

            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #a0e9ff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stats-panel {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .question-counter {

            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 60px;

            font-weight: 600;
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.5);
        }

            margin-top: 14px;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6, #a855f7);
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 0 8px rgba(59,130,246,0.5);
        }

        .quiz-card {
            padding: 28px 26px 32px;
            animation: fadeSlide 0.4s ease-out;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(12px);}
            100% { opacity: 1; transform: translateY(0);}
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.4;
            color: #f1f5f9;
            margin-bottom: 28px;
            letter-spacing: -0.2px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option {
            background: rgba(20, 30, 55, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .option:hover:not(.disabled-opt) {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.6);
            transform: translateX(5px);
        }

        .option.disabled-opt {
            cursor: default;
        }

        .option.correct-highlight {
            background: linear-gradient(105deg, rgba(16, 185, 129, 0.35), rgba(6, 148, 102, 0.25));
            border-left: 5px solid #10b981;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
        }

        .option.wrong-highlight {
            background: linear-gradient(105deg, rgba(239, 68, 68, 0.35), rgba(185, 28, 28, 0.25));
            border-left: 5px solid #ef4444;
        }

        .option-prefix {
            font-weight: 800;
            font-size: 1.1rem;
            width: 34px;
            height: 34px;
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e6;
        }

        .option-text {
            font-size: 0.98rem;
            font-weight: 500;
            color: #e2e8f0;
            line-height: 1.4;
            flex: 1;
        }

            padding: 18px 22px;
            margin: 16px 0 20px;
            border-left: 5px solid;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .feedback-correct {
            border-left-color: #10b981;
            background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05));
        }

        .feedback-wrong {
            border-left-color: #ef4444;
            background: linear-gradient(135deg, rgba(239,68,68,0.12), rgba(239,68,68,0.03));
        }

        .feedback-title {
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback-text {
            font-size: 0.9rem;
            color: #cbd5e6;
            line-height: 1.5;
        }

        .correct-title { color: #4ade80; }

            gap: 16px;
            margin-top: 8px;
        }

            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 0;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-primary {

            border: none;
            color: white;

        }

            justify-content: center;

            background-clip: text;
            color: transparent;

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            padding: 16px 28px;
            margin-top: 28px;
            font-size: 1.1rem;
            font-weight: 700;
            width: auto;

            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff, #a0e9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .landing p, .resume-screen p {
            color: #cbd5e6;
            margin-bottom: 32px;
        }

            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 300px;
            margin: 0 auto;

            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #e2e8f0;

            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;

            padding: 20px 26px 26px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 8px;
        }

            background: linear-gradient(95deg, #2563eb, #7c3aed);
            border: none;
            border-radius: 60px;
            padding: 16px 20px;
            width: 100%;
            font-weight: 700;
            font-size: 1rem;
            color: white;

            background: linear-gradient(135deg, #9b6cf6, #d094fc);

            text-align: center;

            font-size: 0.7rem;
            text-align: center;
            padding: 18px;
            color: #4b5563;
            border-top: 1px solid rgba(255,255,255,0.05);

        @media (max-width: 550px) {
            .quiz-card { padding: 20px 18px; }
            .question-text { font-size: 1.25rem; }
            .option { padding: 12px 16px; }
            .title { font-size: 1.4rem; }
            .notes-button { padding: 14px; font-size: 0.9rem; }
        }
    </style>
</head>

        <p><strong>5.3.2 Temperature Control:</strong> Hot meals must be well-cooked and kept at proper temperature until service. Chillers keep meals cold and fresh. Meals can be reheated <strong>only once</strong> with proper temperature guidelines.</p>
        <p><strong>5.3.3 Meal Heating Guidelines:</strong> Identify meal type and set correct oven temperature. National dish & bread use minimum temperature. Frozen meals must be defrosted earlier. For steam ovens (all meal types), use medium steam for 15–18 minutes.</p>
        
        <p><strong>Oven Temperature & Time Guidelines:</strong></p>
        <ul>
            <li><strong>Fish:</strong> Dry Oven 150°C / 15 min; Steam Oven 110°C / 18 min; Convection 150°C / 15 min</li>
            <li><strong>Beef:</strong> Dry Oven 160°C / 15 min; Steam Oven 130°C / 20 min; Convection 150°C / 18 min</li>
            <li><strong>Chicken:</strong> Dry Oven 160°C / 15 min; Steam Oven 130°C / 22 min; Convection 160°C / 22 min</li>
            <li><strong>Bread Rolls:</strong> Dry Oven 160°C / 6 min; Steam Oven 130°C / 6 min; Convection 170°C / 6 min</li>
            <li><strong>Egg Dishes:</strong> Dry Oven 150°C / 7 min; Steam Oven 110°C / 17 min; Convection 150°C / 10 min</li>
            <li><strong>Pasta:</strong> Dry Oven 150°C / 7 min; Steam Oven 130°C / 20 min; Convection 160°C / 25 min</li>
            <li><strong>Rice/Noodles:</strong> Dry Oven N/A; Steam Oven 130°C / 20 min; Convection 160°C / 25 min</li>
            <li><strong>Vegetarian:</strong> Dry Oven N/A; Steam Oven 110°C / 15 min; Convection 150°C / 19 min</li>
        </ul>

        <p><strong>5.3.4 Oven and Meal:</strong> Check oven operation and temperature distribution. Check meals are hot enough (open 1–2 casseroles from bottom).</p>
        <ul>
            <li><strong>Kosher meals:</strong> Frozen, require additional heating; keep in oven-proof aluminum cover and bag.</li>
            <li><strong>Eggs:</strong> Sensitive to heat—overheating turns them green; underheating makes them watery.</li>
        </ul>

        <p><strong>5.3.5 Cross Contamination:</strong> Keep used and unused service items separate. Never mix used and unused trays/utensils in same trolley. Use yellow seals to identify clean equipment for subsequent services.</p>
        <p><strong>5.3.6 Reporting Technical & Maintenance:</strong> Report chiller temperature fluctuations to Team Leader immediately to avoid serving unsafe food.</p>
        <p><strong>5.3.7 Handling Food Safety Complaints:</strong> Apologize, replace meal, take photos of spoiled food, return meal to catering for investigation. Report with flight report.</p>

        <h4>🍽️ 5.4 Basic Meal Plating (Portioning) Procedure</h4>
        <p><strong>Plating Fundamentals:</strong> Serve hot food on pre-heated plates. Use galley extensions/trolley tops as work areas. B cabin crew organizes plating tools; TL/C1/C3 coordinates service and meal requests.</p>
        
        <p><strong>Plating Sequence:</strong></p>
        <ol>
            <li>Clean galley counter and prepare plating tools.</li>
            <li>Remove hot casseroles from oven (main protein, starch, vegetables, sauce).</li>
            <li>Wash hands, wear white gloves.</li>
            <li>Unwrap covers, pour off excess liquid/fat.</li>
            <li>Place main ingredient slightly off-center, closer to rim facing you.</li>
            <li>Place starch/carbohydrate upper left of main ingredient.</li>
            <li>Place vegetable upper right of main ingredient.</li>
            <li>Add height to layout; lightly pour sauce on top.</li>
        </ol>
        <p><strong>Plating Tools:</strong> Plating Guide, Dining Chinaware, White Gloves, Spoon (delicate foods), Tong (sturdy items), Paper Napkin (wipe dribbles).</p>

        <hr>

        <h4>👶 5.5 Baby Food Handling Procedure</h4>
        <p><strong>To Cool Baby Bottle:</strong> Place bottle in an airsickness bag with ice; test temperature by sprinkling drops on the back of your hand.</p>
        <p><strong>To Warm Baby Bottle:</strong> Place bottle in airsickness bag with hot water; test temperature as above.</p>
        <p><strong>To Heat Baby Food:</strong> Place opened jar in airsickness bag with hot water for ~5 minutes; remove, wipe, place on snack tray with napkins and spoon; give to parent.</p>
        <div class="tip"><strong>⚠️ Important:</strong> Always check expiry dates and ensure age-appropriateness before serving canned baby foods.</div>

        <h4>🛎️ 5.6 Special Meal (SPML) Handling Procedure</h4>
        <p>Special meals are prepared upon passenger request. Three copies of the Special Meal Order List ("MS" list) are given to Team Leader by station/catering agent. Check loaded SPML against list. <strong>Never</strong> remove cellophane casserole cover for Kosher meals—it is oven-proof. For unloaded requests, apologize and offer alternative promptly.</p>

        <p><strong>SPML Categories and Abbreviations:</strong></p>
        <ul>
            <li><strong>Fasting Ethiopian Orthodox:</strong> Vegetables, no milk/meat/egg products, with or without fish. (Fasting VEG/Fish)</li>
            <li><strong>Muslim/Mohammedan:</strong> Vegetable only. (MOML)</li>
            <li><strong>Kosher:</strong> Requested by Jewish passengers; frozen, pre-packed. (KSML) – <strong>Note:</strong> Present sealed tray to passenger before heating; <em>do not remove heat-proof cellophane cover</em> when heating or serving.</li>
            <li><strong>Hindu:</strong> Vegetables, fruits, nuts (raw/cooked) with vegetable oil only; milk products, no egg/no fish. (HNML)</li>
            <li><strong>Vegetarian:</strong> Vegetables, fruits, milk products, eggs. (VGML)</li>
            <li><strong>Vegan/Pure Vegetarian:</strong> No animal products, dairy, or eggs. (VEML)</li>
            <li><strong>Asiatic/Indian Vegetarian:</strong> No animal products, fish, or eggs. (AVML)</li>
            <li><strong>European Vegetarian:</strong> Vegetables with no spice; can eat dairy products. (EVML)</li>
            <li><strong>Western Vegetarian Ovo-Lacto:</strong> Dairy products and eggs. (VLML)</li>
            <li><strong>Baby Meal:</strong> Commercially prepared, strained food. (BBML)</li>
            <li><strong>Child Meal:</strong> Food cut into small pieces, soft, not spicy (e.g., mini sandwiches, chicken nuggets). (CHML)</li>
            <li><strong>Seafood:</strong> Fish only, no meat, eggs, cheese. (SFML)</li>
            <li><strong>Diabetic:</strong> Sugar-free and carbohydrate-free. (DBML)</li>
            <li><strong>Gluten Free:</strong> No flour, corn, grains, manufactured food (e.g., pasta, pastries, mayonnaise). (GFML)</li>
            <li><strong>Salt Free:</strong> No salt. (None)</li>
            <li><strong>Fat Free/Low Fat:</strong> No oil, butter, eggs, dairy products, alcohol. (LFML)</li>
            <li><strong>Lactose Free:</strong> No dairy products. (NLML)</li>
        </ul>

        <div class="highlight">
            <strong>⚠️ Food Allergy Considerations:</strong> Giving the wrong meal to a passenger with allergies can be disastrous. Always confirm SPML requests, check meal lists, and deliver promptly. Check expiry dates before serving (especially BBML, VLML).

    // Helper
    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ---------- QUIZ ENGINE (works with any QUESTIONS_DATA) ----------
    let questions = [];
    let currentIndex = 0;
    let userAnswers = [];
    let answerLocked = false;
    let autoTimer = null;
    let quizInitialized = false;
    let quizDynamicDiv = null; // will hold the #quizContent element

    const STORAGE_KEY = "custom_quiz_progress";
    const CORRECT_SEQ_KEY = "custom_quiz_correct_seq";

    // Generate balanced random sequence (equal distribution of 0-3, no consecutive repeats)
    function generateBalancedRandomSequence(total) {
        const perOption = Math.floor(total / 4);
        let remainder = total % 4;
        let counts = [perOption, perOption, perOption, perOption];
        for (let i = 0; i < remainder; i++) counts[i]++;
        let seq = [];
        let prev = -1;
        for (let i = 0; i < total; i++) {
            let available = [];
            for (let c = 0; c < 4; c++) {
                if (counts[c] > 0 && c !== prev) available.push(c);
            }
            if (available.length === 0) {
                for (let c = 0; c < 4; c++) {
                    if (counts[c] > 0) available.push(c);
                }
            }
            let randomIndex = Math.floor(Math.random() * available.length);
            let chosen = available[randomIndex];
            seq.push(chosen);
            counts[chosen]--;
            prev = chosen;
        }
        return seq;
    }

    // Reorder options so correct answer appears at sequence position
    function reorderQuestionsWithBalancedRandom(questionsArray) {
        const total = questionsArray.length;
        const storedSeq = localStorage.getItem(CORRECT_SEQ_KEY);
        let finalSeq;
        if (storedSeq) {
            finalSeq = JSON.parse(storedSeq);
        } else {
            finalSeq = generateBalancedRandomSequence(total);
            localStorage.setItem(CORRECT_SEQ_KEY, JSON.stringify(finalSeq));
        }
        for (let i = 0; i < questionsArray.length; i++) {
            const q = questionsArray[i];
            const originalCorrectIdx = q.correct;
            const correctText = q.options[originalCorrectIdx];
            const targetPos = finalSeq[i];
            const otherOptions = q.options.filter((_, idx) => idx !== originalCorrectIdx);
            const newOptions = new Array(4);
            newOptions[targetPos] = correctText;
            let otherIdx = 0;
            for (let j = 0; j < 4; j++) {
                if (j === targetPos) continue;
                newOptions[j] = otherOptions[otherIdx++];
            }
            q.options = newOptions;
            q.correct = targetPos;
        }
        return questionsArray;
    }

    function saveProgress() {
        const state = { currentIndex, userAnswers };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadProgress() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        try {
            const state = JSON.parse(saved);
            if (state.userAnswers && state.userAnswers.length === questions.length) {
                currentIndex = state.currentIndex;
                userAnswers = state.userAnswers;
                return true;
            }
        } catch(e) {}
        return false;
    }

    function hasProgress() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        try {
            const state = JSON.parse(saved);
            return state.userAnswers && state.userAnswers.some(a => a !== null);
        } catch(e) { return false; }
    }

    function resetQuiz() {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(CORRECT_SEQ_KEY);
        // Reinitialize with fresh balanced sequence
        const rawCopy = JSON.parse(JSON.stringify(QUESTIONS_DATA));
        questions = reorderQuestionsWithBalancedRandom(rawCopy);
        userAnswers = new Array(questions.length).fill(null);
        currentIndex = 0;
        answerLocked = false;
        saveProgress();
    }

    // ---------- RENDERING FUNCTIONS ----------
    function renderLanding() {
        document.getElementById("appRoot").innerHTML = `
            <div class="quiz-header">

    function renderResume() {
        document.getElementById("appRoot").innerHTML = `
            <div class="quiz-header">
                <div class="badge-row">
                    <div class="title">${escapeHtml(SUBJECT_NAME)} </div>
                </div>

        `;
        document.getElementById("restartQuizBtn").onclick = () => { resetQuiz(); startQuiz(); };
        document.getElementById("continueQuizBtn").onclick = () => startQuiz(true);
        document.getElementById("resumeNotesBtn").onclick = () => showNotes('resume');
    }

    function startQuiz(keepProgress = false) {
        if (!quizInitialized) {
            const rawCopy = JSON.parse(JSON.stringify(QUESTIONS_DATA));
            questions = reorderQuestionsWithBalancedRandom(rawCopy);
            userAnswers = new Array(questions.length).fill(null);
            currentIndex = 0;
            quizInitialized = true;
        }
        if (keepProgress) {
            loadProgress();
        } else {
            userAnswers.fill(null);
            currentIndex = 0;
            saveProgress();
        }
        renderQuiz();
    }

    function renderQuiz() {
        const appRoot = document.getElementById("appRoot");
        appRoot.innerHTML = `
            <div class="quiz-header">
                <div class="badge-row">
                    <div class="title" id="dynamicTitle">Question ${currentIndex+1}</div>
                    <div class="stats-panel">
                        <span class="question-counter" id="counterLabel">${userAnswers.filter(a=>a!==null).length} / ${questions.length}</span>
                    </div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: ${(userAnswers.filter(a=>a!==null).length/questions.length)*100}%"></div>
                </div>
            </div>
            <div id="quizContent"></div>
            <div class="notes-button-wrapper">
                <div class="notes-button" id="notesFromQuizBtn">📘 Read Short Notes</div>
            </div>
            <footer>📚 Based on course material</footer>
        `;
        // Get reference to quiz content container
        quizDynamicDiv = document.getElementById("quizContent");
        renderCurrentQuestion();
        // Attach notes button event
        document.getElementById("notesFromQuizBtn").onclick = () => showNotes('quiz');
    }

    function updateStats() {
  const correctCount = userAnswers.reduce((count, ans, idx) => count + (ans !== null && ans === questions[idx].correct ? 1 : 0), 0);
  const percent = (correctCount / questions.length) * 100;
  const fill = document.getElementById("progressFill");
  const counter = document.getElementById("counterLabel");
  if (fill) fill.style.width = `${percent}%`;
  if (counter) counter.innerText = `${correctCount} / ${questions.length}`;
  const titleDiv = document.getElementById("dynamicTitle");
  if (titleDiv) titleDiv.textContent = `Question ${currentIndex+1}`;
}

    function clearTimer() { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } }

    function selectAnswer(selectedIdx) {
        if (answerLocked) return;
        const q = questions[currentIndex];
        const isCorrect = (selectedIdx === q.correct);
        userAnswers[currentIndex] = selectedIdx;
        updateStats();
        answerLocked = true;
        saveProgress();
        renderFeedback(selectedIdx, isCorrect);
        if (isCorrect) {
            autoTimer = setTimeout(() => {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    answerLocked = false;
                    clearTimer();
                    renderCurrentQuestion();
                    saveProgress();
                } else {
                    if (userAnswers.every(a => a !== null)) renderResults();
                    else renderCurrentQuestion();
                    saveProgress();
                }
            }, 1100);
        }
    }

    function renderFeedback(selectedIdx, isCorrect) {
        const q = questions[currentIndex];
        const letters = ["A","B","C","D"];
        let optionsHtml = "";
        q.options.forEach((opt, idx) => {
            let extraClass = "";
            if (idx === q.correct) extraClass = "correct-highlight";
            else if (idx === selectedIdx && !isCorrect) extraClass = "wrong-highlight";
            optionsHtml += `
                <div class="option disabled-opt ${extraClass}">
                    <div class="option-prefix">${letters[idx]}</div>
                    <div class="option-text">${escapeHtml(opt)}</div>
                </div>
            `;
        });
        const correctLetter = letters[q.correct];
        const feedbackHtml = isCorrect ?
            `<div class="feedback-panel feedback-correct"><div class="feedback-title correct-title">✓ CORRECT</div><div class="feedback-text">${escapeHtml(q.explanation)}</div></div>` :
            `<div class="feedback-panel feedback-wrong"><div class="feedback-title wrong-title">✗ INCORRECT</div><div class="feedback-text"><strong>Correct answer: ${correctLetter}. ${escapeHtml(q.options[q.correct])}</strong><br>${escapeHtml(q.explanation)}</div></div>`;
        const navHtml = `
            <div class="nav-buttons">
                <div class="btn btn-outline" id="navPrev">◀ Previous</div>
                <div class="btn btn-primary" id="navNext">${currentIndex === questions.length-1 ? "Finish" : "Next ▶"}</div>
            </div>
        `;
        quizDynamicDiv.innerHTML = `<div class="quiz-card"><div class="question-text">${escapeHtml(q.text)}</div><div class="options-grid">${optionsHtml}</div>${feedbackHtml}${navHtml}</div>`;
        document.getElementById("navPrev")?.addEventListener("click", () => {
            if (currentIndex > 0) {
                clearTimer(); currentIndex--; answerLocked = false; renderCurrentQuestion(); saveProgress();
            }
        });
        const nextBtn = document.getElementById("navNext");
        if (nextBtn) {
            nextBtn.addEventListener("click", () => {
                if (currentIndex < questions.length-1) {
                    clearTimer(); currentIndex++; answerLocked = false; renderCurrentQuestion(); saveProgress();
                } else {
                    renderResults();
                }
            });
        }
        updateStats();
    }

    function renderCurrentQuestion() {
        clearTimer();
        if (userAnswers[currentIndex] !== null) {
            const saved = userAnswers[currentIndex];
            const isCor = (saved === questions[currentIndex].correct);
            renderFeedback(saved, isCor);
            return;
        }
        answerLocked = false;
        const q = questions[currentIndex];
        const letters = ["A","B","C","D"];
        let optsHtml = "";
        q.options.forEach((opt, idx) => {
            optsHtml += `<div class="option" data-opt="${idx}"><div class="option-prefix">${letters[idx]}</div><div class="option-text">${escapeHtml(opt)}</div></div>`;
        });
        const navHtml = `<div class="nav-buttons"><div class="btn btn-outline" id="prevClean">◀ Previous</div><div class="btn btn-primary" id="nextClean">${currentIndex === questions.length-1 ? "Finish" : "Next ▶"}</div></div>`;
        quizDynamicDiv.innerHTML = `<div class="quiz-card"><div class="question-text">${escapeHtml(q.text)}</div><div class="options-grid" id="optGrid">${optsHtml}</div>${navHtml}</div>`;
        document.querySelectorAll(".option").forEach(opt => {
            opt.addEventListener("click", (e) => {
                const idx = parseInt(opt.dataset.opt);
                selectAnswer(idx);
            });
        });
        document.getElementById("prevClean")?.addEventListener("click", () => {
            if (currentIndex > 0) { currentIndex--; renderCurrentQuestion(); saveProgress(); }
        });
        document.getElementById("nextClean")?.addEventListener("click", () => {
            if (currentIndex < questions.length-1) { currentIndex++; renderCurrentQuestion(); saveProgress(); }
            else if (userAnswers[currentIndex] !== null && currentIndex === questions.length-1) renderResults();
        });
        updateStats();
    }

    function renderResults() {
        let score = 0;
        for (let i=0; i<questions.length; i++) if (userAnswers[i] === questions[i].correct) score++;
        const percent = Math.round((score/questions.length)*100);
        let verdict = percent>=85 ? `🏆 ${SUBJECT_NAME} Master` : percent>=70 ? `🖨️ Advanced ${SUBJECT_NAME} Practitioner` : percent>=55 ? `📘 Emerging ${SUBJECT_NAME} Learner` : `🌱 ${SUBJECT_NAME} Explorer`;
        quizDynamicDiv.innerHTML = `<div class="quiz-card result-container"><div class="score-circle"><div class="score-number">${score}</div><div style="color:#94a3b8;">/ ${questions.length}</div></div><div class="verdict">${verdict}</div><p style="color:#cbd5e6; margin:12px 0;">Accuracy: ${percent}% • Mastery Level</p><div class="btn restart-btn" id="restartBtn">⟳ Restart Exam</div></div>`;
        document.getElementById("restartBtn")?.addEventListener("click", () => {
            resetQuiz();
            startQuiz();
        });
        const titleDiv = document.getElementById("dynamicTitle");
        if (titleDiv) titleDiv.textContent = "Quiz Completed";
    }

    function showNotes(returnView) {
        const appRoot = document.getElementById("appRoot");
        appRoot.innerHTML = `
            <div class="quiz-header">
                <div class="badge-row">
                    <div class="title">📘 Short Notes</div>
                </div>
            </div>
            <div class="notes-page">
                ${SHORT_NOTES_HTML}
                <button class="back-btn" id="backFromNotes">← Back</button>
            </div>
            <footer>📚 Based on course material</footer>
        `;
        document.getElementById("backFromNotes").onclick = () => {
            if (returnView === 'landing') renderLanding();
            else if (returnView === 'resume') renderResume();
            else if (returnView === 'quiz') startQuiz(true);
            else renderLanding();
        };
    }

    // ---------- INITIAL RENDERING ----------
    function initApp() {
        if (hasProgress()) {
            renderResume();
        } else {
            renderLanding();
        }
    }
    initApp();
</script>
</body>
</html>
